[project]
name = "rmr-platform"
version = "5.4.1.2+interaction.regression.correction.po1"
description = "RMR Global v5.4.1.2 Interaction Regression Correction Product Owner Candidate"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "sqlalchemy==2.0.50",
  "jinja2==3.1.6",
  "pydantic==2.13.4",
  "python-multipart==0.0.29",
  "PyJWT==2.13.0",
  "cryptography==46.0.4",
  "httpx==0.28.1",
  "alembic==1.18.4",
  "psycopg[binary]==3.2.9",
  "openpyxl==3.1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not legacy_packaging'"
markers = ["legacy_packaging: opt-in historical PO checks requiring privately retained archives/launchers"]
