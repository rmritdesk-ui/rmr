<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate RMR Software Access</title><link rel="stylesheet" href="/cb1/assets/cb1.css"></head><body class="cb1-page"><main class="activate"><h1>Activate Client Administrator Access</h1><p>Create your own password. Your account will be assigned only to the authorized client tenant.</p><label>New password<input id="p1" type="password" minlength="10"></label><label>Confirm password<input id="p2" type="password" minlength="10"></label><button class="primary" id="go">Activate Account</button><div id="result"></div></main><script>const token="__TOKEN__";document.querySelector('#go').onclick=async()=>{const p1=document.querySelector('#p1').value,p2=document.querySelector('#p2').value;if(p1!==p2){result.textContent='Passwords do not match.';return}const r=await fetch('/api/cb1/client-admins/activate',{method:'POST',headers:{'Content-Type':'application/json','X-RMR-Request':'1'},body:JSON.stringify({token,password:p1})});const d=await r.json();result.innerHTML=r.ok?'<p class="good">Account activated. <a href="/">Sign in to RMR Software</a>.</p>':'<p class="bad">'+(d.detail||'Activation failed.')+'</p>'}</script><script src="/cb1/assets/enhancements.js"></script>

</body></html>
