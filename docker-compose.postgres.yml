services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rmr
      POSTGRES_USER: rmr
      POSTGRES_PASSWORD: ${RMR_POSTGRES_PASSWORD:-rmr-local-certification-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmr -d rmr"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - rmr_cb1_postgres_data:/var/lib/postgresql/data
  app:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RMR_DATABASE_URL: postgresql+psycopg://rmr:${RMR_POSTGRES_PASSWORD:-rmr-local-certification-only}@postgres:5432/rmr
      DATABASE_URL: postgresql+psycopg://rmr:${RMR_POSTGRES_PASSWORD:-rmr-local-certification-only}@postgres:5432/rmr
      RMR_APP_VERSION: 5.4.1.2-interaction-regression-correction-po1
volumes:
  rmr_cb1_postgres_data:
